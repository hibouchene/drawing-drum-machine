<!DOCTYPE html>
<html>
<head>
    <title>Drawing Drum Machine</title>
    <link rel="stylesheet" href="./main.css">
    <meta charset = "UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="bgvid-container">
        <div id="bgcolor" class="bg"></div>
        <img src="./assets/images/IMG_20250813_103002.jpg" class="bg">
        <video id="bgvid"></video>
    </div>
    <div id="app">
        <div id="left" class="section">
            <ddm-main id="ddm" samples="github:tidalcycles/dirt-samples"></ddm-main>
        </div>
        <div id="right" class="section">
            <div id="title-container">
                <div id="title-left">
                    <p id="big" contenteditable="true" spellcheck="false" class="title">drawing drum machine</p>
                    <p id="small" contenteditable="true" spellcheck="false" class="title">drawing+coding sequencer</p>
                </div>
                <div id="title-right">
                    <div id="params">
                        <input id="tempo" placeholder="120"></input>
                    <label for="tempo">bpm</label>
                </div>
                </div>
            </div>
            <div id="editor">
                <ddm-channels></ddm-channels>
            </div>
        </div>
        </div>
    </div>
    <script src="./main.js" type="module"></script>
</body>
</html>
